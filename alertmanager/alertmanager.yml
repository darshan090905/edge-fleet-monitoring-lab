global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "instance"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "ops-webhook"

receivers:
  - name: "ops-webhook"
    # In Day 3, this webhook delivers alerts directly to our Flask Jira ticket service!
    webhook_configs:
      - url: "http://ticket-service:5001/alert"
        send_resolved: true
