global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Connect Prometheus to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Load Alert Rules
rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Edge Bridge System Metrics (Node Exporter on port 9100)
  - job_name: "bridge_nodes"
    static_configs:
      - targets:
          - "bridge-01:9100"
          - "bridge-02:9100"
          - "bridge-03:9100"
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance

  # Edge Bridge Application Metrics (Python Agent on port 8000)
  - job_name: "bridge_agents"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "bridge-01:8000"
          - "bridge-02:8000"
          - "bridge-03:8000"
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance

  # Blackbox Probe for Camera RTSP Stream (TCP Port 8554)
  - job_name: "blackbox_camera"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "cam:8554"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # Blackbox Probe for Bridge Health Endpoints (HTTP 200 checks)
  - job_name: "blackbox_bridge_health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://bridge-01:8000/health"
          - "http://bridge-02:8000/health"
          - "http://bridge-03:8000/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  # Edge AI Computer Vision Telemetry (Port 8005)
  - job_name: "edge_ai"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-ai:8005"]
    relabel_configs:
      - target_label: instance
        replacement: "edge-ai"
